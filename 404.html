<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Pampered Pets</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0a12">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .error-page { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 3rem 1.25rem; color: var(--on-dark);
    background: radial-gradient(700px 420px at 50% 20%, rgba(122, 63, 76, 0.5), transparent 70%), var(--night); }
  .error-page__inner { max-width: 34rem; }
  .error-page__code { font: italic 300 clamp(5rem, 20vw, 8rem)/1 var(--font-display); color: var(--gold); }
  .error-page h1 { font-size: 2.2rem; margin: 0.5rem 0 1rem; }
  .error-page p { color: var(--on-dark-soft); }
  .error-page .btn-row { justify-content: center; margin-top: 2rem; }
</style>
</head>
<body>
<main class="error-page">
  <div class="error-page__inner">
    <p class="error-page__code">404</p>
    <h1>This page has wandered off</h1>
    <p>Let&rsquo;s get you back to the parlour.</p>
    <div class="btn-row">
      <a class="btn btn--gold" href="tel:02086865048">Call 020 8686 5048</a>
      <a class="btn btn--glass" href="/">Back to home</a>
    </div>
  </div>

</body>
</html>
