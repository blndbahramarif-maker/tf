name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kurdora
          POSTGRES_PASSWORD: kurdora_ci
          POSTGRES_DB: kurdora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kurdora -d kurdora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://kurdora:kurdora_ci@localhost:5432/kurdora_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        # --max-warnings 0: warnings are errors in CI. A warning nobody fixes
        # is noise that hides the next real problem.
        run: pnpm exec eslint . --max-warnings 0

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate database schema
        run: pnpm run db:validate

      - name: Lint API contract
        run: pnpm run openapi:lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        # Advisory at this stage; becomes blocking in Phase 12 (hardening).
        run: pnpm audit --audit-level high || true
