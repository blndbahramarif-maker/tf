# Netlify configuration for the Pampered Pets website.
# The site is plain HTML, so there is nothing to build — Netlify just
# serves the files in this folder.

[build]
  publish = "."
  command = ""

# Photographs, fonts and icons never change without a new filename,
# so browsers can keep them for a year.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers on every address, including the bare "/" that visitors
# actually type. ("/*.html" alone misses it.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The page itself is re-checked on every visit, so edits show up straight
# away. (Netlify already does this for HTML by default.)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
